services:
  - type: web
    name: sdp-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: sdp-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # set this manually to your Vercel URL after first deploy

databases:
  - name: sdp-db
    plan: free
